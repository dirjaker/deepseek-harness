# The dsh-tui bundle patch: an interactive terminal surface directly over
# dsh-base. It keeps the process alive, creates one Agent, and sends each
# entered line as a new ordinary user turn until the user exits.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: hmr
  disabled: true

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: tui-startup
      name: '@deepseek-ai/dsh-tui/startup'

    - id: tui-runner
      name: '@deepseek-ai/dsh-tui'
      inject: [tuiStartup]
      config:
        prompt: !!js ctx.tuiStartup.prompt
        initialTask: !!js ctx.tuiStartup.initialTask
